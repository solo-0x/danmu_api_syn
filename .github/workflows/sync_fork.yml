name: Fork Sync

on:
  schedule:
    - cron: "0 0 * * *" # 每天北京时间 08:00；实际运行可能延迟
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync_fork.yml

permissions:
  contents: write

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch --no-tags upstream main

      - name: Merge upstream and preserve local workflows
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already synchronized with upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-commit --no-ff upstream/main; then
            # 工作流冲突由本仓库版本解决；业务代码冲突必须人工处理。
            unresolved=0
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/*) ;;
                *) echo "::error::Merge conflict in $path"; unresolved=1 ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)
            if [[ "$unresolved" == 1 ]] || ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git merge --abort || true
              exit 1
            fi
          fi

          # GITHUB_TOKEN 无权更新工作流，恢复本仓库工作流并移除上游新增工作流。
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git diff --cached --exit-code -- .github/workflows
          git commit -m "chore: sync upstream while preserving local workflows"
          git push origin HEAD:main
          echo "Synced upstream $(git rev-parse --short upstream/main); preserved local workflows." >> "$GITHUB_STEP_SUMMARY"
